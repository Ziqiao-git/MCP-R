[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolgym"
version = "0.1.0"
description = "An Open-world Tool-using Environment for LLM Agent Evaluation"
readme = "../README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ToolGym Team"}
]
keywords = ["llm", "agents", "tools", "mcp", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "faiss-cpu>=1.7.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
embeddings = [
    "FlagEmbedding>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Ziqiao-git/ToolGym"
Documentation = "https://ziqiao-git.github.io/ToolGym"
Repository = "https://github.com/Ziqiao-git/ToolGym"

[tool.setuptools.packages.find]
where = ["."]
